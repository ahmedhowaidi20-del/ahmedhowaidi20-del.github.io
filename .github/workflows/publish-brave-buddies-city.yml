name: Publish Brave Buddies City
on:
  push:
    paths:
      - '.github/workflows/publish-brave-buddies-city.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the game and the homepage button
        run: |
          curl -fsSL -o brave-buddies-city.html "https://d2ol7oe51mr4n9.cloudfront.net/user_39l3DMACayModxJOxtV6R2TTnVT/9303b458-fa87-49d7-bddd-51aa01a12857.html"
          test "$(wc -c < brave-buddies-city.html)" -eq 2570765
          head -c 15 brave-buddies-city.html | grep -q '<!DOCTYPE html>'
          curl -fsSL -o brave-buddies-3d.html "https://d2ol7oe51mr4n9.cloudfront.net/user_39l3DMACayModxJOxtV6R2TTnVT/92f7259d-01bf-4637-aa57-50f9331e6bf7.html"
          test "$(wc -c < brave-buddies-3d.html)" -eq 16487720
          python3 - <<'PY'
          p = 'index.html'
          s = open(p, encoding='utf-8').read()
          a = '<a href="brave-buddies.html" class="btn-teal"><span>🦸 Brave Buddies</span></a>'
          b = '<a href="brave-buddies-city.html" class="btn-teal"><span>🏙️ Brave Buddies City</span></a>'
          if b not in s:
              assert a in s
              s = s.replace(a, a + b, 1)
              open(p, 'w', encoding='utf-8', newline='').write(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brave-buddies-city.html brave-buddies-3d.html index.html
          git diff --cached --quiet || git commit -m "Brave Buddies 3D: Badoory reappears after a game"
          git push
